# INSTALL
# cp tmuxconf ~/.tmux.conf
#

set -g prefix C-b
set -g history-limit 10000

set-option -g default-shell /opt/homebrew/bin/fish

# Modern terminal type inside tmux.
set -g default-terminal "tmux-256color"

# Ghostty uses TERM=xterm-ghostty outside tmux.
# Tell tmux that Ghostty supports RGB/truecolor.
set -as terminal-features ",xterm-ghostty:RGB"

# Source file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Set title
set -g set-titles on
set -g set-titles-string "#T"

# Mouse mode
set -g mode-keys vi
set -g terminal-overrides 'xterm-ghostty*:smcup@:rmcup@'
set -g mouse on

# Stop jump to the end after yanking (copy)
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi y send-keys -X copy-selection

set -g base-index 1
setw -g pane-base-index 1

# re-number windows when one is closed
set -g renumber-windows on

# word separators for automatic word selection
setw -g word-separators ' @"=()[]_-:,.'
setw -ag word-separators "'"

# Window border
set -g pane-border-style fg=grey
set -g pane-border-lines heavy
set -g pane-active-border-style "bg=default fg=red"

# New window/pane in current dir
bind-key c new-window      -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Move window
bind-key -n 'C-S-Left'  swap-window -t -1\; select-window -t -1\;
bind-key -n 'C-S-Right' swap-window -t +1\; select-window -t +1\;

# Equally resize all panes
bind-key = select-layout even-horizontal
bind-key | select-layout even-vertical

# Resize panes
bind-key J resize-pane -D 10
bind-key K resize-pane -U 10
bind-key H resize-pane -L 10
bind-key L resize-pane -R 10

# Toggle top/bottom panes: 1:1 <-> N:1 (expand current pane)
# Change these two numbers to adjust the expanded ratio.
set -g @pane_toggle_numerator 3
set -g @pane_toggle_denominator 4

bind-key m run-shell '
  count="$(tmux list-panes | wc -l | tr -d " ")"
  [ "$count" -eq 2 ] || { tmux display-message "Need exactly 2 panes"; exit 0; }

  num="$(tmux show-option -gqv @pane_toggle_numerator)"
  den="$(tmux show-option -gqv @pane_toggle_denominator)"

  current_h="$(tmux display -p "#{pane_height}")"
  total_h="$(tmux display -p "#{window_height}")"
  expanded_h=$((total_h * num / den))
  even_h=$((total_h / 2))

  # toggle: if current pane is around half, expand it; otherwise reset to even
  if [ "$current_h" -le $((even_h + 1)) ]; then
    tmux resize-pane -y "$expanded_h"
    # tmux display-message "Top/bottom ratio: ${num}:$((den - num))"
  else
    tmux resize-pane -y "$even_h"
    # tmux display-message "Top/bottom ratio: 1:1"
  fi
'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

# Select panes 
# NOTE(arslan): See to prevent cycling https://github.com/tmux/tmux/issues/1158
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# This tmux statusbar config was created by tmuxline.vim
# on Wed, 25 Nov 2015
set -g status "on"
set -g status-bg "#1f2330"
set -g status-justify "left"
set -g status-position "bottom"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left "#{prefix_highlight}#[fg=#0b1220,bg=#7dd3fc,bold] #S #[fg=#7dd3fc,bg=#1f2330,nobold,nounderscore,noitalics]"
set -g @df_cmd_private1 "/System/Volumes/Data"

# Caffeinate script to prevent MacOS sleeping
set -g status-right '#[fg=#1f2330,bg=#fb923c,bold] #($HOME/bin/caff.sh status) #[fg=#fb923c,bg=#1f2330,nobold]'

set -ag status-right '#[fg=#e2e8f0,bg=#334155] #{df_avail_private1} #{df_percent_private1} '

set -g @cpu_percentage_format "%.0f%%" # Add left padding
set -ag status-right '#[fg=#1f2330]#{cpu_bg_color} CPU #{cpu_icon} #{cpu_percentage} '

set -ag status-right '#[fg=#e2e8f0,bg=#334155]#{battery_status_bg} Batt #{battery_icon} #{battery_percentage} #[fg=#0f172a,bg=#cbd5e1,bold] %a %h-%d %H:%M '

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#94a3b8,bg=#1f2330] #I #[fg=#94a3b8,bg=#1f2330]#W "
setw -g window-status-current-format "#[fg=#1f2330,bg=#334155,nobold,nounderscore,noitalics]#[fg=#f8fafc,bg=#334155,bold] #I #[fg=#f8fafc,bg=#334155,bold]#{?window_zoomed_flag,#[fg=#86efac][],}#W #[fg=#334155,bg=#1f2330,nobold,nounderscore,noitalics]"

# List of plugins
# see this https://github.com/tmux-plugins/tpm to installation
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # A set of pre configured settings
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # Highlight when prefix key is pressed
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'junegunn/tmux-fzf-url'
set -g @plugin 'tassaron/tmux-df'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key ','

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
